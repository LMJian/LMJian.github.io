name: "Build and Deploy to GitHub Pages"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tracked files
        run: python3 scripts/check_tracked_files.py

      - name: Check example download packages
        run: |
          python3 scripts/package_order_demo.py --check
          python3 scripts/package_deep_learning_demo.py --check

      - name: Validate annual holiday data
        run: python3 scripts/check_holidays.py

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Check homepage and Git metadata regressions
        run: |
          bundle exec ruby scripts/check_home.rb
          bundle exec ruby scripts/check_lastmod.rb

      - name: Verify holiday data does not change blog pages
        run: bundle exec ruby scripts/check_holiday_isolation.rb
        env:
          JEKYLL_ENV: production

      - name: Check generated pages
        run: python3 scripts/check_site.py _site "${{ steps.pages.outputs.base_path }}"

      - name: Verify published holiday files
        run: python3 scripts/check_holidays.py --site _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
